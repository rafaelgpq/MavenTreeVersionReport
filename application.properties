# Default run analyzes the committed teaching example, so `mvn compile exec:java` works on a fresh clone.
# Point deps.file at your own captured tree for real work (see README, "Capturing a real tree").
# Dependency tree to analyze (Maven Dependency Plugin text output, see README).
# Use forward slashes for Windows paths, too. Relative paths are resolved against the directory containing this file.
# Overridable with -Ddeps.file=...
deps.file=examples/conflict/dependency-tree.txt

# Directory for the reports. Relative paths are resolved against the directory containing this file.
# Overridable with -Dreport.dir=...
report.dir=target/dependency-conflict-report

# Dependency scopes to include: "all" (default) or a comma-separated list of
# compile, provided, runtime, test, system, import. Scopes are provenance, not part of a dependency's identity.
scopes.include=all

# true (default): parse errors, including malformed dependency entries or inconsistent hierarchy,
# fail the run with exit status 1. Unknown ordinary prose only produces a warning.
# false: parse errors mark the analysis INCOMPLETE and return exit status 2.
parser.strict=true

# false (default): do not write the informational dependencyManagement candidates XML.
report.dependencyManagement=false
